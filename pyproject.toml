[project]
name = "soroe"
version = "0.1.0"
description = "Find the temporal offset between two MKV files of the same content"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
]

[project.scripts]
soroe = "soroe:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soroe"]
